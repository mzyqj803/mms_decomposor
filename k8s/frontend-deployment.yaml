apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: mms
  labels:
    app: frontend
spec:
  replicas: 2  # 可以根据需要调整副本数
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: mms-frontend:latest  # 请确保镜像已推送到您的镜像仓库
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
          name: http
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"

