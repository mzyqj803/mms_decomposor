apiVersion: v1
kind: Secret
metadata:
  name: mms-secrets
  namespace: mms
type: Opaque
stringData:
  # MariaDB 配置
  mysql-root-password: password
  mysql-database: mms_db
  mysql-user: mms_user
  mysql-password: mms_password
  # 后端数据库连接配置
  spring-datasource-username: mms_user
  spring-datasource-password: mms_password
  # JWT 密钥（生产环境请修改）
  jwt-secret: mms-decomposor-secret-key-change-in-production-environment-2024

