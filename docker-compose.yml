services:
  # MariaDB数据库
  mariadb:
    image: mariadb:11
    container_name: mms-mariadb
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: mms_db
      MYSQL_USER: mms_user
      MYSQL_PASSWORD: mms_password
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3307:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./src/main/resources/sql/data_init/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./src/main/resources/sql/data_init/data_init.sql:/docker-entrypoint-initdb.d/02-data_init.sql
      - ./src/main/resources/sql/data_init/cleanup_duplicate_components_with_fk.sql:/docker-entrypoint-initdb.d/03-cleanup_duplicates.sql
      - ./src/main/resources/sql/data_init/add_quantity_to_components_relationship.sql:/docker-entrypoint-initdb.d/04-add_quantity_field.sql
      - ./src/main/resources/sql/data_init/update_components_relationship_quantity_from_spec.sql:/docker-entrypoint-initdb.d/05-update_quantity_from_spec.sql
      - ./src/main/resources/sql/data_init/fastener_warehouse_data.sql:/docker-entrypoint-initdb.d/06-fastener_warehouse_data.sql
      - ./src/main/resources/sql/data_init/create_component_fastener_views.sql:/docker-entrypoint-initdb.d/07-create_component_fastener_views.sql
      - ./src/main/resources/sql/data_init/update_procurement_flag.sql:/docker-entrypoint-initdb.d/08-update_procurement_flag.sql
      - ./src/main/resources/sql/data_init/update_common_parts_flag.sql:/docker-entrypoint-initdb.d/09-update_common_parts_flag.sql
      - ./src/main/resources/sql/data_init/fix_duplicate_component_specs.sql:/docker-entrypoint-initdb.d/10-fix_duplicate_specs.sql
      - ./src/main/resources/sql/migration/add_component_status.sql:/docker-entrypoint-initdb.d/11-add_component_status.sql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    networks:
      - mms-network

  # Redis缓存
  redis:
    image: redis:6.0-alpine
    container_name: mms-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - mms-network

  # 后端服务
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
      tags:
        - mms-backend:latest
    image: mms-backend:latest
    container_name: mms-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb:3306/mms_db?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: mms_user
      SPRING_DATASOURCE_PASSWORD: mms_password
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - mms-network

  # 前端服务
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      tags:
        - mms-frontend:latest
    image: mms-frontend:latest
    container_name: mms-frontend
    ports:
      - "9000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - mms-network

volumes:
  mariadb_data:
  redis_data:

networks:
  mms-network:
    driver: bridge
