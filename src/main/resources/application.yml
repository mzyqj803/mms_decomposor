server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: mms-decomposor
  
  datasource:
    url: jdbc:mariadb://mariadb:3306/mms_db?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: mms_user
    password: mms_password
    driver-class-name: org.mariadb.jdbc.Driver
    # HikariCP 连接池配置
    hikari:
      # 连接池最大连接数（并行分解需要足够的连接）
      maximum-pool-size: 20
      # 最小空闲连接数
      minimum-idle: 5
      # 连接超时时间（毫秒）- 从连接池获取连接的最大等待时间
      connection-timeout: 30000
      # 空闲连接超时时间（毫秒）- 连接在池中空闲的最长时间
      idle-timeout: 600000
      # 连接最大生命周期（毫秒）- 连接的最大存活时间
      max-lifetime: 1800000
      # 连接测试查询
      connection-test-query: SELECT 1
      # 自动提交
      auto-commit: true
      # 连接池名称
      pool-name: MMS-HikariCP
      # 泄漏检测阈值（毫秒）- 超过此时间未归还的连接会被记录
      leak-detection-threshold: 60000
    
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
        format_sql: false
        
  data:
    redis:
      host: redis
      port: 6379
      password: 
      database: 0
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms
          

# 日志配置
logging:
  level:
    com.mms: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping: DEBUG
    # HikariCP 连接池日志
    com.zaxxer.hikari.HikariConfig: DEBUG
    com.zaxxer.hikari: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/mms-decomposor.log

# 文件上传配置
spring.servlet.multipart:
  max-file-size: 10MB
  max-request-size: 10MB
